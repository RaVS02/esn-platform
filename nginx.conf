server {
    # Limit wgrywanych plików (domyślnie nginx przyjmuje tylko 1 MB). Aplikacja i tak egzekwuje własne limity zdjęć.
    client_max_body_size 8m;

    listen 80;
    server_name localhost;
 
    # ── Główny portal (FastAPI) ──────────────────────────────────────────────
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Set-Cookie;
        proxy_set_header   Cookie            $http_cookie;
    }
 
    # ── Magazyn komponentów (Flask) ──────────────────────────────────────────
    location /magazyn/ {
        rewrite ^/magazyn/(.*) /$1 break;
        rewrite ^/magazyn$     /  break;
 
        proxy_pass         http://electrolab_magazyn:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
 
        # KLUCZOWE: przekaż ciasteczko JWT do Flaska
        proxy_pass_header  Set-Cookie;
        proxy_set_header   Cookie            $http_cookie;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}